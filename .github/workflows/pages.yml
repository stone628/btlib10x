# Publishes the static web apps to GitHub Pages at https://stone628.github.io/btlib10x/.
# Repository Settings → Pages → Source must be "GitHub Actions".
# The avatar gallery (pages and its functions/ API) is Cloudflare-only and is
# left out by `npm run dist:pages`.
name: Pages

# Manual only: run it from the Actions tab ("Pages" → "Run workflow") or with
# `gh workflow run pages.yml`. Pushes never deploy.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

# Runners are pinned to ubuntu-24.04 rather than ubuntu-latest, which moves to
# Ubuntu 26 from October 2026; the build only needs the Node from setup-node.
# Every action below runs on Node 24 (upload-pages-artifact@v5 wraps
# upload-artifact@v7).
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          # Build stamps read per-path git history; a shallow clone fails the build.
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # The catalog packs are gitignored, so build them from their tracked sources.
      - run: npm run pack
      - run: npm run pack:sw
      - run: npm run dist:pages
        env:
          SITE_BASE: /btlib10x/
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist/pages

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
