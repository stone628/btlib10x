<!doctype html>
<html lang="en" data-theme="bt10x">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>bt10x Instant Action</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="preload" href="fonts/bt10x-mono-0.63.2-regular.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="bt10x.css" />
    <link rel="stylesheet" href="tui.css" />
    <link rel="stylesheet" href="instant.css" />
  </head>
  <body>
    <header id="topbar" data-tui-raw>
      <span id="topbar-title">bt10x instant action <span id="topbar-version"></span></span>
      <nav id="fontsize">
        <button class="link-button" type="button" data-fs="-1">A</button>
        <output id="fontsize-value"></output>
        <button class="link-button" type="button" data-fs="1">A</button>
        <button class="link-button" type="button" data-fs="fit">Fit</button>
      </nav>
      <nav id="lang">
        <button class="link-button" type="button" data-lang="en" lang="en">EN</button>
        <button class="link-button" type="button" data-lang="ko" lang="ko">한국어</button>
      </nav>
      <button id="motd-open" class="link-button" type="button"><span id="motd-dot" hidden></span>MOTD</button>
      <a id="home-link" class="link-button" href="./" title="bt10x home">← bt10x</a>
    </header>
    <dialog id="motd" data-tui-raw>
      <div id="motd-head"><span id="motd-title">MOTD</span><button id="motd-close" type="button">✕</button></div>
      <div id="motd-body"></div>
    </dialog>
    <div id="stage" class="tui">
      <div id="stage-inner">
        <main id="screen"><div id="app"></div></main>
      </div>
    </div>
    <footer id="legal" data-tui-raw>
      Unofficial fan project. Not affiliated with or endorsed by Catalyst Game Labs, The Topps
      Company, Inc. or Microsoft.<br/>BattleTech, BattleMech, 'Mech and MechWarrior are trademarks
      of their respective owners.
    </footer>
    <script src="tui.js"></script>
    <script type="importmap">{ "imports": { "btlib10x": "./btlib10x.js" } }</script>
    <script type="module" src="./instant.js"></script>
  </body>
</html>
