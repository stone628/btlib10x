<svg xmlns="http://w3.org" viewBox="0 0 256 256" width="256" height="256">
  <!-- 배경: 순수한 검은색 -->
  <rect width="256" height="256" rx="48" fill="#000000" />
  
  <!-- 터미널 프레임 테두리 (미세한 녹색 빛) -->
  <rect x="20" y="20" width="216" height="216" rx="32" fill="none" stroke="#103410" stroke-width="8" />
  
  <!-- 터미널 커맨드 심볼 및 텍스트 (P1 Phosphor Green: #4AFF00 또는 #33FF33) -->
  <g transform="translate(40, 110)" fill="#33FF33" font-family="Courier, monospace" font-weight="bold">
    <!-- 프롬프트 기호 -->
    <text x="0" y="42" font-size="64" fill="#4AFF00">bt &gt;</text>
    <!-- 커서 블록 -->
    <rect x="130" y="-10" width="28" height="58" fill="#4AFF00" />
  </g>
</svg>

